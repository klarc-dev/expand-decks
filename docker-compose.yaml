services:
  postgres:
    image: postgres:16-alpine
    pull_policy: always
    restart: always
    mem_limit: 512m
    volumes:
      - /home/joachim/docker/expand-decks/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      expand-decks:
        aliases:
          # Use an application-specific hostname. Coolify also attaches Compose
          # services to shared networks where the generic `postgres` alias can
          # resolve to an unrelated database container.
          - expand-decks-postgres

  payload:
    build:
      context: .
      args:
        APP_COMMIT: ${SOURCE_COMMIT:-unknown}
    pull_policy: always
    restart: always
    mem_limit: 1g
    command: ["sh", "-c", "sleep 5 && pnpm payload migrate && pnpm start"]
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      TZ: Europe/Paris
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      # Reachable CloudCLIProxy address from inside the container (the tailnet
      # hostname is not routable from the Docker network — use the host bridge).
      CLIPROXYAPI_BASE_URL: ${CLIPROXYAPI_BASE_URL}
      CLIPROXYAPI_KEY: ${CLIPROXYAPI_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-high}
      AGENT_SOURCE_REGISTRY_JSON: ${AGENT_SOURCE_REGISTRY_JSON:-[]}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      APP_COMMIT: ${SOURCE_COMMIT:-unknown}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - /home/joachim/docker/expand-decks/media:/app/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r => process.exit(r.ok && (await r.json()).status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      - "traefik.http.middlewares.hsts-expand-decks.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hsts-expand-decks.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hsts-expand-decks.headers.stsPreload=true"
    networks:
      coolify:
        aliases:
          - expand-decks
      expand-decks:
        aliases:
          - payload

  payload-worker-1: &payload-worker
    build:
      context: .
      args:
        APP_COMMIT: ${SOURCE_COMMIT:-unknown}
    pull_policy: always
    restart: always
    mem_limit: 2g
    # long-lived scheduler: bare `jobs:run` is one-shot (exits 0, drains once)
    # which under restart:always caused an endless ~60s flap loop. --cron keeps
    # the process alive and runs the default queue every minute.
    command: ["pnpm", "exec", "payload", "jobs:run", "--queue", "default", "--cron", "* * * * *"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      APP_COMMIT: ${SOURCE_COMMIT:-unknown}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - /home/joachim/docker/expand-decks/media:/app/media
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      expand-decks:
        aliases:
          - payload-worker

  # Coolify assigns a fixed container_name to every Compose service, which is
  # incompatible with deploy.replicas. Two explicit services retain concurrent
  # queue processing while giving each worker a unique container identity.
  payload-worker-2:
    <<: *payload-worker

networks:
  coolify:
    external: true
  expand-decks:
