name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slides_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slides_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'
      # Placeholder values so Payload/Next config loads at build time.
      # Build must not connect to a live DB; these only satisfy config parsing.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/slides_ci
      PAYLOAD_SECRET: ci-placeholder-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:4317
      OPENAI_BASE_URL: http://localhost:9999/v1
      OPENAI_API_KEY: ci-placeholder
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_FONTS_API_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `fallow audit --gate new-only` can diff against the base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir slidev-workspace install --frozen-lockfile --ignore-workspace
          pnpm --dir slidev-workspace exec playwright install chromium
          mkdir -p media

      - name: Generate Payload artifacts
        run: |
          pnpm generate:types
          pnpm generate:importmap

      - name: Deploy env drift gate
        run: python3 scripts/check-coolify-env-sync.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting (Biome)
        run: pnpm format:check

      - name: Lint (Biome)
        run: pnpm check

      - name: Lint (Next Core Web Vitals)
        run: pnpm lint

      - name: Dead-code gate (new issues only)
        run: pnpm lint:dead:ci

      - name: Test
        run: pnpm test

      - name: Deterministic evaluation checks
        run: pnpm eval:ci

      - name: Upload deterministic evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-ci-${{ github.sha }}
          path: artifacts/evals/ci.json
          if-no-files-found: error

      - name: Build
        env:
          MASTRA_DISABLE_INIT: '1'
        run: pnpm build

  eval-live:
    name: Mastra production quality gates
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, expand-decks]
    environment: production
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slides_eval
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slides_eval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:55432/slides_eval
      OBSERVABILITY_DATABASE_URL: postgres://postgres:postgres@localhost:55432/slides_eval
      PAYLOAD_SECRET: eval-placeholder-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:4317
      CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
      CLIPROXYAPI_KEY: ${{ secrets.CLIPROXYAPI_KEY }}
      APP_COMMIT: ${{ github.sha }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      WRITER_CONCURRENCY: '1'
      REVISE_MAX_ITERATIONS: '1'

    steps:
      - name: Clean self-hosted workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Mastra production eval gates
        run: pnpm test:agent-evals
      - name: Seed persistent versioned datasets
        run: pnpm eval:seed
      - name: Run persistent experiment
        run: pnpm eval:experiment
      - name: Sync environment to Coolify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
          CLIPROXYAPI_KEY: ${{ secrets.CLIPROXYAPI_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AGENT_SOURCE_REGISTRY_JSON: ${{ secrets.AGENT_SOURCE_REGISTRY_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: bash scripts/sync-coolify-env.sh

      - name: Deploy verified revision to Coolify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_URL"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_APPLICATION_UUID"

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg uuid "$COOLIFY_APPLICATION_UUID" \
              '{uuid: $uuid, force: true}')" \
            "$COOLIFY_URL/api/v1/deploy")
          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$response")
          test -n "$deployment_uuid"

          for attempt in $(seq 1 90); do
            status=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$deployment_uuid" | \
              jq -r '.status // empty')
            case "$status" in
              finished)
                for health_attempt in $(seq 1 24); do
                  health=$(curl --max-time 15 --silent --show-error \
                    "${{ secrets.NEXT_PUBLIC_SERVER_URL }}/api/health?release=${{ github.sha }}-$attempt-$health_attempt" || true)
                  deployed_commit=$(jq -r '.commit // empty' <<<"$health" 2>/dev/null || true)
                  if [[ "$deployed_commit" == "${{ github.sha }}" ]]; then
                    exit 0
                  fi
                  sleep 5
                done
                echo "::error::Coolify finished but production did not report the expected commit within 2 minutes"
                exit 1
                ;;
              failed|cancelled)
                failure=$(curl --fail-with-body --silent --show-error \
                  --header "Authorization: Bearer $COOLIFY_TOKEN" \
                  "$COOLIFY_URL/api/v1/deployments/$deployment_uuid")
                echo "::error::Coolify deployment $deployment_uuid ended with status $status"
                jq -r '.logs // empty' <<<"$failure" | tail -n 80
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Coolify deployment $deployment_uuid did not finish within 15 minutes"
          exit 1
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-${{ github.sha }}
          path: artifacts/evals/*.json
          if-no-files-found: error
