name: Sync Coolify Secrets

# Manual re-sync only. The production deploy in ci.yml runs the same script
# (scripts/sync-coolify-env.sh) immediately before deploying, so every push to
# main already syncs its environment. A push trigger here would race that job
# and could apply a stale environment after the deploy had started.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-env-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/sync-coolify-env.yml
    secrets: inherit
