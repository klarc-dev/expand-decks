name: Sync Coolify Secrets

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yaml
      - docker-compose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync Compose variables to Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
          CLIPROXYAPI_KEY: ${{ secrets.CLIPROXYAPI_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AGENT_SOURCE_REGISTRY_JSON: ${{ secrets.AGENT_SOURCE_REGISTRY_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_URL"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_APPLICATION_UUID"

          mapfile -t keys < <(
            grep -oE '\$\{[A-Z0-9_]+' docker-compose.yaml |
              cut -c3- |
              sort -u
          )

          data='[]'
          missing=0
          for key in "${keys[@]}"; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::$key is referenced by docker-compose.yaml but missing from the production environment"
              missing=1
              continue
            fi
            data=$(jq \
              --arg key "$key" \
              --arg value "$value" \
              '. + [{key: $key, value: $value, is_runtime: true, is_buildtime: true}]' \
              <<<"$data")
          done
          [[ "$missing" == 0 ]]

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --argjson data "$data" '{data: $data}')" \
            "$COOLIFY_URL/api/v1/applications/$COOLIFY_APPLICATION_UUID/envs/bulk" \
            >/dev/null

          echo "Synced ${#keys[@]} variables to Coolify."
